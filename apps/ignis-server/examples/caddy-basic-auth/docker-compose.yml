services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ignis
    restart: unless-stopped

  ignis:
    image: ghcr.io/senshinya/ignis:latest
    # To build from source instead, comment out `image` and uncomment:
    # build: ../../
    environment:
      - OBSIDIAN_VERSION=1.13.7
      # Obsidian 1.13+ starts only after you accept its terms statement.
      # Read it at https://github.com/senshinya/ignis/blob/main/apps/docs/src/content/docs/server/environment.md#obsidian-terms, then uncomment:
      # - OBSIDIAN_ACCEPT_TERMS=true
    volumes:
      - ./vaults:/vaults
      - ./data:/app/data
      - obsidian-app:/app/obsidian-app
    networks:
      - ignis
    restart: unless-stopped

networks:
  ignis:

volumes:
  caddy_data:
  caddy_config:
  obsidian-app:
