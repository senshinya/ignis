# Builds the server image and pushes it to GitHub Container Registry.
#
# A tag push (v<package.json version>[+build metadata]) publishes <version> and latest.
# A manual run publishes sha-<commit> only, for testing a branch without moving latest.

name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and tags
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            tag_version="${tag_version%%+*}"

            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi

            tags="${image}:${version}"$'\n'"${image}:latest"
          else
            tags="${image}:sha-${short_sha}"
          fi

          {
            echo "version=$version"
            echo "build=$short_sha"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/ignis-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: IGNIS_BUILD=${{ steps.meta.outputs.build }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
